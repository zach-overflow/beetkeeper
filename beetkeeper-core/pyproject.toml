# Build-only pyproject for `beetkeeper-core:beetkeeper-whl`: with `generate_setup=False`, setuptools reads this
# file directly and Pants does no dependency inference — the `[project]` deps below are hand-maintained and
# must match what the code imports.
[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=84.2.1" ]

[project]
name = "beetkeeper"
description = "Self-hosted webserver for interactive Beets music library administration."
readme = "README.md"
keywords = [
  "beets",
  "beets server",
  "music tagging",
  "music tags",
  "music-library",
  "self-hosted",
]
license = "AGPL-3.0-or-later"
maintainers = [ { name = "zach-overflow" } ]
authors = [ { name = "Zach Gottesman" } ]
requires-python = ">=3.14,<3.15"
dynamic = [ "version" ]
dependencies = [
  "aiosqlite>=0.21",
  "alembic>=1.18.5",
  "anyio>=4.15.1",
  "beetkeeper-plugin",
  "beets>=2.14.1",
  "click>=8.4.1",
  "fastapi>=0.160.0",
  "greenlet>=3.1",
  "httpx2>=2.16.0",
  "jinja2",
  "pydantic>=2.14.0",
  "pydantic-settings>=2.14.2",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0.3",
  "sqlalchemy",
  "sqlmodel>=0.0.46",
  "starlette",
  "uvicorn>=0.49.0",
]
urls."Bug Tracker" = "https://github.com/zach-overflow/beetkeeper/issues"
urls.Changelog = "https://github.com/zach-overflow/beetkeeper/releases"
urls.Documentation = "https://beetkeeper.dadbodaudio.com/latest/"
urls.Repository = "https://github.com/zach-overflow/beetkeeper"
scripts.beetkeeper = "beetkeeper.main:main"

[tool.setuptools]
packages.find.where = [ "src" ]
packages.find.include = [ "beetkeeper*" ]
# `script.py.mako` omitted: only needed to author new revisions, `db upgrade` works without it.
package-data."beetkeeper.db" = [ "alembic.ini" ]
# Static assets live in non-package subdirs (no __init__.py), so patterns must be recursive + path-qualified
# under the top `beetkeeper` package — bare `*.css` only matches files directly in `beetkeeper/`.
package-data.beetkeeper = [
  "api/static/**/*.css",
  "api/static/**/*.html",
  "api/static/**/*.ico",
  "api/static/**/*.js",
  "api/static/**/*.png",
  "api/static/**/*.svg",
  "py.typed",
]
# The version comes from the git tag: Pants' `vcs_version` target (src/beetkeeper/BUILD) generates
# `_scm_version.py` via setuptools-scm, and `_version.py` re-exports it (falling back to a dev placeholder
# for builds outside Pants, e.g. the uv dev venv, where the generated module doesn't exist).
dynamic.version = { attr = "beetkeeper._version.__version__" }

# No `[tool.mypy]` here: Pants runs one mypy against the repo-root config, so it'd be silently ignored.
[tool.uv]
package = true
