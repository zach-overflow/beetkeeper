directory: /test_dirs/music
library: /test_dirs/beets/library.blb

beetkeeper:
  log_level: INFO
  server:
    hostname: 0.0.0.0
    port: 8337
  database:
    sqlite_path: /test_dirs/beets/beetkeeper.db
  auth:
    enable_login_protection: true
    username: admin
    password: admin
  # Answered by dev_scripts/fake_downloader_api.py (started by test_container_init.sh) for the fake albums.
  downloader_hook:
    base_url: http://127.0.0.1:8338
    search_endpoint_path: /api/v2/torrents/info
    beets_field_names_to_query_param_names:
      album: name
    filepath_json_key: content_path
