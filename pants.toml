[GLOBAL]
backend_packages = [
  "pants.backend.build_files.fmt.ruff",
  "pants.backend.docker",
  "pants.backend.docker.lint.hadolint",
  "pants.backend.experimental.adhoc",
  # For `vcs_version` (setuptools-scm-derived versions from git tags).
  "pants.backend.experimental.python",
  "pants.backend.experimental.python.lint.ruff.check",
  "pants.backend.experimental.python.lint.ruff.format",
  "pants.backend.experimental.tools.yamllint",
  "pants.backend.experimental.visibility",
  # https://www.pantsbuild.org/stable/reference/subsystems/openapi-generator
  "pants.backend.experimental.openapi",
  "pants.backend.experimental.openapi.codegen.python",
  "pants.backend.python",
  "pants.backend.python.lint.bandit",
  "pants.backend.python.typecheck.mypy",
  "pants.backend.shell",
  "pants.backend.shell.lint.shellcheck",
  "pants.backend.shell.lint.shfmt",
  "pants.backend.tools.taplo",
  # "pyproject_fmt_pants_plugin",
]
pants_version = "2.33.1"
plugins = [
  # https://pypi.org/project/pyproject-fmt-pants-plugin/
  "pyproject-fmt-pants-plugin==0.4.4",
]
build_patterns = ["BUILD", "BUILD.*"]
build_file_prelude_globs = ["etc/build_scripts/pants_macros.py"]
colors = true
pants_ignore = [
  ".*/",
  "**/.venv/",
  "/dist/",
  "/site/",
  "__pycache__",
  "!.semgrep/",
  "!.github/",
]

[changed]
dependents = "transitive"

[source]
# Components live at `<component>/src/<package>` (tests included, as `<component>/src/tests`), so the unanchored
# `src` roots every component; the cross-component `provides/integration_tests/` and `etc/build_scripts/` are anchored.
root_patterns = ["src", "/provides/integration_tests", "/etc/build_scripts"]

[docker]
use_buildx = true
# Puts Docker Desktop's `credsStore = "desktop"` helper on the build process PATH; `pants.ci.toml` clears
# this since CI runners lack it (CI must run with `PANTS_CONFIG_FILES=pants.ci.toml`).
tools = ["docker-credential-desktop"]

[docker.registries.ghcr]
address = "ghcr.io"

# Pants' default hadolint (v2.12.1-beta) has no macOS arm64 build and runs the x86_64 one under Rosetta.
# v2.13+ ships native arm64 binaries under lowercase `<os>-<arch>` asset names.
[hadolint]
version = "v2.15.1"
known_versions = [
  "v2.15.1|macos_arm64 |5c09f3213f8e40406abe048233d985eebef336d4a6a20021be47fadb6cf480a2|102616248",
  "v2.15.1|macos_x86_64|ffe9bb18b23d5ed1eae50237aecdbb523d016e96da0bd4e7aa432040acfc3fde|23407592",
  "v2.15.1|linux_arm64 |f6198ef8090f404dbb771abfee086eb8c48ac177f30da7fd3510aca35b344b5d|60491096",
  "v2.15.1|linux_x86_64|c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507|55661096",
]
url_platform_mapping = { macos_arm64 = "macos-arm64", macos_x86_64 = "macos-x86_64", linux_arm64 = "linux-arm64", linux_x86_64 = "linux-x86_64" }

# Pants 2.33's default pex (2.97.1) only knows pip <= 26.1.2; 2.104.0+ adds pip 26.2.2 and a certifi 2026.10.19
# CA bundle (https://discuss.python.org/t/109576). Same universal `pex` file for every platform.
[pex-cli]
version = "v2.104.1"
known_versions = [
  "v2.104.1|macos_x86_64|09b82471a777606cc1b74af13c3a4c8d09982dfb2d448d5dd0ce5d408ea1035b|5408285",
  "v2.104.1|macos_arm64|09b82471a777606cc1b74af13c3a4c8d09982dfb2d448d5dd0ce5d408ea1035b|5408285",
  "v2.104.1|linux_x86_64|09b82471a777606cc1b74af13c3a4c8d09982dfb2d448d5dd0ce5d408ea1035b|5408285",
  "v2.104.1|linux_arm64|09b82471a777606cc1b74af13c3a4c8d09982dfb2d448d5dd0ce5d408ea1035b|5408285",
]

# https://pypi.org/project/pyproject-fmt-pants-plugin/
[pyproject-fmt]
config_discovery = true
# The repo-wide `pyproject-fmt` settings live here rather than in a `pyproject-fmt.toml` file.
# https://pyproject-fmt.readthedocs.io/en/latest/configuration.html#command-line-interface
args = [
  "--column-width=120",
  "--indent=2",
  "--keep-full-version",
  "--no-generate-python-version-classifiers",
]

[setuptools]
install_from_resolve = "tools-resolve"

[setuptools-scm]
install_from_resolve = "tools-resolve"

[tailor]
build_file_name = "BUILD"

[taplo]
glob_pattern = [
  "**/*.toml",
  # `pyproject-fmt` handles `pyproject.toml` files.
  "!**/pyproject.toml",
  "!.taplo.toml",
  "!taplo.toml",
]

[test]
extra_env_vars = ["PANTS=true"]

[cli.alias]
--all-changed = "--changed-since=HEAD --changed-dependents=transitive"

# https://www.pantsbuild.org/stable/reference/subsystems/openapi-generator
[openapi-generator]
version = "7.26.0"
lockfile = "etc/3rdparty/jvm/openapi-generator.lock"

[python-bootstrap]
search_path = ["<PYENV>", "<ASDF>", "<PATH>"]

[python]
# resolver = "uv"
resolver = "pex"
enable_resolves = true
default_resolve = "beetkeeper-resolve"
interpreter_constraints = ["CPython>=3.14,<3.15"]
interpreter_versions_universe = ["3.14", "3.15"]
default_to_resolve_interpreter_constraints = true
pip_version = "latest"
separate_lockfile_metadata_file = true
# Floors for security patches; the uv counterpart is `[tool.uv] constraint-dependencies` in `pyproject.toml`.
resolves_to_constraints_file = { "__default__" = "etc/3rdparty/python/security-constraints.txt" }

[python.resolves]
"beetkeeper-resolve" = "etc/3rdparty/python/beetkeeper-lockfile.json"
"tools-resolve" = "etc/3rdparty/tools/tools-lockfile.json"
"client-resolve" = "etc/3rdparty/python/client-lockfile.json"

# [python.resolves_to_interpreter_constraints]
# "beetkeeper-resolve" = ["CPython>=3.14,<3.15"]

[bandit]
args = ["--quiet", "--severity-level=medium", "--confidence-level=medium"]
config = "pyproject.toml"
install_from_resolve = "tools-resolve"
requirements = ["bandit"]

[mypy]
config = "pyproject.toml"
install_from_resolve = "tools-resolve"
requirements = [
  "mypy",
  "mypy-extensions",
  "pydantic",        # for the `pydantic.mypy` plugin so type checking can proceed on test files
  "pytest",
]

[pytest]
config = "pyproject.toml"
install_from_resolve = "tools-resolve"
# Must include every plugin whose options we pass in `args`/`addopts` (e.g. `pytest-socket`), or pex's
# argparse rejects those options: https://www.pantsbuild.org/stable/reference/subsystems/pytest#requirements
requirements = [
  "fastapi[standard]",
  "pytest",
  "pytest-mock",
  "pytest-socket",
  "pytest-xdist",
  "ruamel-yaml",
  "tomlkit",
]
xdist_enabled = false

[ruff]
version = "0.16.6"
known_versions = [
  "0.16.6|linux_arm64 |9b28fc0646a7379c5a25f68b559669c39bc000325bbad5b64b47fcf6a3b582ae|9592731",
  "0.16.6|linux_x86_64|63740c5a1576dea4e1f2ff3f7427031188d23a11b7a4f78560749b8732a3b724|10337077",
  "0.16.6|macos_arm64 |77513748c833b435b82453ba20e07db808ef6c5121945ede80a6cf21bee468a4|9331576",
  "0.16.6|macos_x86_64|87cce7e591603efa979be9044ac00835638a5d9052947070b6e2e7c0cdb21940|9840296",
]

[update-build-files]
fmt = true
formatter = "ruff"

[yamllint]
config_file_name = "etc/.yamllint.yaml"
