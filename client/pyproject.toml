# Build-only pyproject for `client:client-whl`: with `generate_setup=False`, setuptools reads this file
# directly. The `beetkeeper_api_client` package is generated by Pants from `src/openapi.json` at build time,
# so it only exists inside Pants sandboxes (this is not a uv workspace member).
[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beetkeeper-api-client"
dynamic = ["version"]
requires-python = ">=3.12"
# Must mirror the `requirements.txt` openapi-generator emits for the `httpx2` library: Pants fails codegen
# unless every one of those has a `python_requirement` in `client-resolve`.
dependencies = [
  "httpx2",
  "pydantic>=2.14.0",
  "python-dateutil>=2.8.2",
  "typing-extensions>=4.7.1",
]
authors = [{ name = "Zach Gottesman" }]
maintainers = [{ name = "zach-overflow" }]
keywords = ["beets", "beetkeeper", "api client", "music-library", "self-hosted"]
license = "AGPL-3.0-or-later"
description = "Python client for the beetkeeper REST API, generated from its OpenAPI spec."
readme = "README.md"

[project.urls]
Documentation = "https://beetkeeper.dadbodaudio.com/latest/"
Repository = "https://github.com/zach-overflow/beetkeeper"
"Bug Tracker" = "https://github.com/zach-overflow/beetkeeper/issues"
Changelog = "https://github.com/zach-overflow/beetkeeper/releases"

# The version comes from the git tag: Pants' `vcs_version` target (src/BUILD) generates `_scm_version.py`
# via setuptools-scm, and setuptools reads its `version` literal statically.
[tool.setuptools.dynamic]
version = { attr = "beetkeeper_api_client._scm_version.version" }

# `include` keeps the generator's `test/` package out of the wheel.
[tool.setuptools.packages.find]
where = ["src"]
include = ["beetkeeper_api_client*"]

[tool.setuptools.package-data]
beetkeeper_api_client = ["py.typed"]
