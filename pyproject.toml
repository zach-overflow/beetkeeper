# The distribution's build-system/`[project]` config lives in `beetkeeper-core/pyproject.toml` to avoid Pants'
# `python_distribution` metadata injection; see the comment there.
[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "fastapi[standard]>=0.160.0",
  "ipython>=9.3.0",
  "mutagen>=1.47.0",
  "mypy>=2.3.1",
  "pytest>=9.1.1",
  "pytest-mock>=3.15.1",
  "pytest-socket>=0.8.1",
  "pytest-xdist>=3.8.0",
  "ruamel-yaml>=0.19.1",
  "ruff>=0.16.8",
  "tomlkit",
]

[tool.uv]
# uv < 0.13.4 ships a CA bundle trusting the revoked emSign root; see https://discuss.python.org/t/109576
required-version = ">=0.13.4"
# Constrains only how uv resolves the shared lockfile, keeping both workspace members' `beets` in lockstep;
# the wheels' actual `beets` deps come from each member's `[project]`.
# When bumping this, the Docker base image must be bumped as well.
constraint-dependencies = [
  "beets>=2.14.1",
  # Security constraint: CA bundle without the revoked emSign root, see
  # https://discuss.python.org/t/109576 (mirrored for Pants in `3rdparty/python/security-constraints.txt`)
  "certifi>=2026.10.19",
  # Security constraint for preventing ealier `mako` versions with vulnerabilities
  "mako>=1.4.2",
  # Security constraint for preventing earlier `urllib3` versions with vulnerabilities
  "urllib3>=2.8.0",
]
sources.beetkeeper = { workspace = true }
sources.beetkeeper_plugin = { workspace = true }
# Members must be registered here or uv (which only reads this root file) can't see them and `uv lock` fails.
workspace.members = [ "beetkeeper-core", "plugin" ]

[tool.ruff]
target-version = "py314"
line-length = 120
indent-width = 4
src = [ "beetkeeper-core/src", "client/src", "plugin/src" ]
format.skip-magic-trailing-comma = true
format.docstring-code-format = true
lint.select = [ "B", "E", "F", "I", "SIM", "UP" ]
lint.extend-select = [
  "ASYNC",
  "C416",
  "D101",
  "D107",
  "D209",
  "D213",
  "D417",
  "D419",
  "ERA001",
  "FAST",
  "LOG",
  "PIE790",
  "PLE1142",
  "PLE1700",
  "PLW0603",
  "PT",
  "PYI045",
  "PYI055",
  "RUF006",
  "RUF008",
  "RUF009",
  "RUF010",
  "RUF012",
  "RUF015",
  "RUF018",
  "RUF022",
  "RUF024",
  "RUF032",
  "RUF033",
  "RUF049",
  "RUF100",
  "RUF101",
  "RUF200",
  "TC",
  "TID25",
  "TRY002",
  "W291",
]
# Ignore rules that conflict with the ruff formatter (https://stackoverflow.com/a/77796620).
lint.ignore = [
  "COM812",
  "COM819",
  "D206",
  "D300",
  "E111",
  "E114",
  "E117",
  "E203",
  "E501",
  "PT003",
  "PT019",
  "PT022",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "TC003",
  "W191",
]
lint.exclude = [ "beetkeeper-core/src/tests/**/*.py", "build_scripts/**/*.py" ]
# TC off: runtime-needed type hints like `fastapi.Depends` must not move under TYPE_CHECKING.
lint.per-file-ignores."beetkeeper-core/src/beetkeeper/api/**/*.py" = [ "D101", "TC" ]
# TC off: these are all runtime pydantic models.
lint.per-file-ignores."beetkeeper-core/src/beetkeeper/db/**/*.py" = [ "TC" ]
lint.per-file-ignores."integration_tests/**/*.py" = [ "I" ]
lint.per-file-ignores."plugin/**/*.py" = [ "TID25" ]
lint.flake8-tidy-imports.banned-api.httpx.msg = "Use httpx2 instead."
lint.flake8-tidy-imports.banned-api.requests.msg = "Use httpx2 instead."
lint.flake8-type-checking.exempt-modules = [ "typing", "typing_extensions" ]
lint.flake8-type-checking.runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "sqlalchemy.orm.DeclarativeBase",
  "sqlmodel.SQLModel",
]
lint.isort.known-first-party = [
  "beetkeeper",
  "beetkeeper_api_client",
  "beetsplug.beetkeeper_plugin",
]
lint.isort.section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
lint.isort.split-on-trailing-comma = false
lint.pycodestyle.ignore-overlong-task-comments = true
lint.pydocstyle.convention = "google"

[tool.bandit]
exclude_dirs = [
  ".github",
  ".venv",
  "beetkeeper-core/src/tests",
  "build_scripts",
  "docs",
  "integration_tests",
  "plugin/src/tests",
]

[tool.mypy]
exclude = [ "build_scripts/", "docs/" ]
namespace_packages = true
explicit_package_bases = true
python_version = "3.14"
plugins = [ "pydantic.mypy" ]
overrides = [
  # openapi-generator output (see `client/src/BUILD`): its signatures still type-check callers, but errors
  # inside the generated modules aren't ours to fix.
  { module = [ "beetkeeper_api_client", "beetkeeper_api_client.*" ], ignore_errors = true }
]

[tool.pytest]
addopts = [
  "--force-short-summary",
  "--tb=line",
  "-p",
  "no:cacheprovider",
  "--disable-socket",
  "--allow-hosts=testclient",
]
filterwarnings = [ "error:pytest.PytestWarning.*" ]
minversion = "9.1"
strict_markers = true
